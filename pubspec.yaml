name: nyse_bites
description: "Baked Shop."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo.jpg
  adaptive_icon_background: '#F3E7DC'
  adaptive_icon_foreground: assets/images/logo.jpg

flutter:

  uses-material-design: true

  assets:
    - assets/images/